name: Auto Label
on:
  pull_request:
    types: [opened, edited]
  issues:
    types: [opened, edited]
jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - name: Auto Label Issues and PRs
        uses: actions/labeler@v4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
